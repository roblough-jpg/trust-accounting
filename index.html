<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C21 Optimum Realty — Trust Accounting</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');
:root {
  --bg: #f5f4f0;
  --surface: #ffffff;
  --border: #e2e0d8;
  --border-strong: #c8c5ba;
  --text: #1a1916;
  --text-muted: #6b6860;
  --text-faint: #9c9a94;
  --accent: #252526;
  --accent-hover: #3a3a3b;
  --gold: #B8A97A;
  --gold-light: #f5f0e4;
  --gold-dark: #8a7d55;
  --red: #8b2020;
  --red-light: #fdf0f0;
  --green: #1a4a2a;
  --green-light: #eef6f1;
  --amber: #7a4f00;
  --amber-light: #fdf6e3;
  --radius: 8px;
  --radius-lg: 12px;
  --shadow: 0 1px 3px rgba(0,0,0,0.06),0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.10),0 2px 4px rgba(0,0,0,0.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;font-size:14px;background:var(--bg);color:var(--text);min-height:100vh}
.layout{display:flex;height:100vh;overflow:hidden}
.sidebar{width:230px;flex-shrink:0;background:var(--accent);display:flex;flex-direction:column}
.sidebar-logo{padding:20px 20px 16px;border-bottom:1px solid rgba(255,255,255,0.1)}
.sidebar-logo img{width:100%;max-width:160px;display:block}
.sidebar-nav{flex:1;padding:10px 0;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 20px;font-size:13px;color:rgba(255,255,255,0.6);cursor:pointer;border-left:3px solid transparent;user-select:none;transition:all 0.15s}
.nav-item:hover{background:rgba(255,255,255,0.07);color:rgba(255,255,255,0.9)}
.nav-item.active{background:rgba(184,169,122,0.15);color:#fff;border-left-color:var(--gold);font-weight:500}
.nav-icon{font-size:15px}
.sidebar-footer{padding:14px 20px;border-top:1px solid rgba(255,255,255,0.1);font-size:11px;color:rgba(255,255,255,0.35)}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 28px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.page-title{font-size:17px;font-weight:500}
.page-subtitle{font-size:12px;color:var(--text-muted);margin-top:1px}
.topbar-actions{display:flex;gap:8px;align-items:center}
.content{flex:1;overflow-y:auto;padding:24px 28px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px 24px;box-shadow:var(--shadow)}
.card+.card{margin-top:16px}
button{font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;border-radius:var(--radius);padding:8px 16px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);font-weight:400;transition:all 0.12s;white-space:nowrap}
button:hover{background:var(--bg)}
button.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:500}
button.btn-primary:hover{background:var(--accent-hover)}
button.btn-gold{background:var(--gold);color:#fff;border-color:var(--gold-dark);font-weight:500}
button.btn-gold:hover{background:var(--gold-dark)}
button.btn-danger{color:var(--red);border-color:#e8c0c0}
button.btn-danger:hover{background:var(--red-light)}
button.btn-sm{padding:5px 11px;font-size:12px}
button.btn-ghost{border-color:transparent;background:transparent;color:var(--text-muted);padding:5px 10px}
button.btn-ghost:hover{background:var(--bg);color:var(--text)}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;color:var(--text-muted);margin-bottom:5px;font-weight:500;letter-spacing:.01em}
input,select,textarea{font-family:'DM Sans',sans-serif;font-size:13px;color:var(--text);background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--radius);padding:8px 12px;width:100%;transition:border-color .12s;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(184,169,122,0.15)}
.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{text-align:left;padding:9px 10px;border-bottom:1px solid var(--border);color:var(--text-muted);font-weight:500;font-size:11px;letter-spacing:.04em;text-transform:uppercase;background:var(--bg);white-space:nowrap}
tbody td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:#fafaf8}
.void-row td{color:var(--text-faint);font-style:italic}
.badge{display:inline-block;font-size:11px;font-weight:500;padding:2px 8px;border-radius:20px}
.badge-green{background:var(--green-light);color:var(--green)}
.badge-red{background:var(--red-light);color:var(--red)}
.badge-amber{background:var(--amber-light);color:var(--amber)}
.badge-gold{background:var(--gold-light);color:var(--gold-dark)}
.badge-gray{background:var(--bg);color:var(--text-muted);border:1px solid var(--border)}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.stat-card .stat-label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.stat-card .stat-value{font-size:20px;font-weight:500;font-family:'DM Mono',monospace;letter-spacing:-.02em}
.amt-credit{color:var(--green);font-family:'DM Mono',monospace;font-size:12px}
.amt-debit{color:var(--red);font-family:'DM Mono',monospace;font-size:12px}
.amt-bal{font-family:'DM Mono',monospace;font-size:12px;font-weight:500}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:flex-start;justify-content:center;padding-top:60px;z-index:1000}
.modal{background:var(--surface);border-radius:var(--radius-lg);border:1px solid var(--border);padding:24px;width:560px;max-width:95vw;max-height:85vh;overflow-y:auto;box-shadow:var(--shadow-md)}
.modal-title{font-size:16px;font-weight:500;margin-bottom:18px}
.alert{padding:10px 14px;border-radius:var(--radius);font-size:13px;margin-bottom:14px}
.alert-success{background:var(--green-light);color:var(--green)}
.alert-warning{background:var(--amber-light);color:var(--amber)}
.alert-error{background:var(--red-light);color:var(--red)}
.alert-info{background:var(--gold-light);color:var(--gold-dark)}
.flex{display:flex;align-items:center;gap:8px}
.flex-between{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.filter-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.filter-bar input,.filter-bar select{width:auto;flex:1;min-width:140px}
.section-header{font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px}
.divider{border:none;border-top:1px solid var(--border);margin:16px 0}
.trade-back-btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text-muted);cursor:pointer;margin-bottom:16px}
.trade-back-btn:hover{color:var(--text)}
.no-entries-hint{color:var(--text-faint);font-size:12px;padding:16px;text-align:center}
.assign-btn{font-size:11px;padding:3px 8px;color:var(--gold-dark);border-color:#d4c89a}
.assign-btn:hover{background:var(--gold-light)}
.receipt-doc{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:28px 32px;max-width:460px}
.receipt-doc .co-logo{max-width:160px;margin-bottom:10px}
.receipt-doc .co-addr{font-size:12px;color:var(--text-muted);margin-bottom:20px}
.receipt-doc .receipt-title{font-size:14px;font-weight:500;margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.receipt-field{margin-bottom:14px}
.receipt-field .rf-label{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);margin-bottom:2px}
.receipt-field .rf-value{font-size:14px;font-weight:500}
.photo-placeholder{margin-top:20px;border:1.5px dashed var(--border-strong);border-radius:var(--radius);padding:30px;text-align:center;color:var(--text-faint);font-size:12px;cursor:pointer;transition:border-color .15s}
.photo-placeholder:hover{border-color:var(--gold)}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:3px}
.sync-indicator{font-size:11px;color:rgba(255,255,255,0.4);padding:0 20px 12px;display:flex;align-items:center;gap:6px}
.sync-dot{width:6px;height:6px;border-radius:50%;background:#4caf50;flex-shrink:0}
.sync-dot.syncing{background:var(--gold);animation:pulse 1s infinite}
.sync-dot.error{background:#ef5350}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}

/* Mobile responsive */
@media(max-width:768px){
  .sidebar{width:200px}
  .content{padding:16px}
  .topbar{padding:12px 16px}
  .form-row{grid-template-columns:1fr}
  .summary-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:580px){
  .layout{flex-direction:column}
  .sidebar{width:100%;height:auto;flex-direction:row;overflow-x:auto}
  .sidebar-logo{display:none}
  .sidebar-nav{display:flex;flex-direction:row;padding:0;white-space:nowrap}
  .nav-item{border-left:none;border-bottom:3px solid transparent;padding:12px 14px}
  .nav-item.active{border-left:none;border-bottom-color:var(--gold)}
  .nav-icon{display:none}
  .sidebar-footer,.sync-indicator{display:none}
  .main{height:calc(100vh - 52px)}
}
</style>
</head>

// ── Supabase Client ───────────────────────────────────────────────────────────
async function initSupabase() {
  // Load Supabase JS
  await new Promise((res,rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js';
    s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });

  if (!SUPABASE_URL || !SUPABASE_KEY) {
    setSyncStatus('error', 'Not configured');
    showCredentialsScreen();
    return;
  }

  await connectSupabase();
}

async function connectSupabase() {
  try {
    db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    setSyncStatus('syncing', 'Loading...');
    await loadFromDB();
    setSyncStatus('ok', 'Synced');
    db.channel('trust_entries')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'trust_entries' }, () => {
        loadFromDB().then(() => renderContent());
      })
      .subscribe();
  } catch(e) {
    setSyncStatus('error', 'Connection failed');
    console.error(e);
    loadLocalState();
  }
  renderNav();
  renderContent();
}

function setSyncStatus(status, text) {
  const dot = document.getElementById('sync-dot');
  const txt = document.getElementById('sync-text');
  if (!dot || !txt) return;
  dot.className = 'sync-dot' + (status === 'syncing' ? ' syncing' : status === 'error' ? ' error' : '');
  txt.textContent = text;
}

// ── DB Operations ─────────────────────────────────────────────────────────────
async function loadFromDB() {
  const { data: settings } = await db.from('trust_settings').select('*').limit(1).single();
  if (settings) state.openingBalance = settings.opening_balance || 0;

  const { data: entries, error } = await db.from('trust_entries').select('*').order('sort_order', { ascending: true });
  if (error) throw error;
  state.entries = (entries || []).map(dbRowToEntry);
  state.nextId = state.entries.reduce((m,e) => Math.max(m, e.id), 0) + 1;
  rebuildBalances();

  // Load transfer photos
  await loadTransferPhotosFromDB();
}

async function loadTransferPhotosFromDB() {
  if (!db) return;
  try {
    const { data, error } = await db.from('trust_transfer_photos').select('*').order('sort_order', { ascending: true });
    if (error) throw error;
    uiState.transferPhotos = {};
    (data || []).forEach(row => {
      if (!uiState.transferPhotos[row.conf_number]) uiState.transferPhotos[row.conf_number] = [];
      uiState.transferPhotos[row.conf_number].push({ data: row.photo_data, dbId: row.id });
    });
  } catch(e) { console.error('Failed to load transfer photos', e); }
}

async function saveTransferPhotoDB(conf, photoData) {
  if (!db) return null;
  setSyncStatus('syncing', 'Saving photo...');
  const { data, error } = await db.from('trust_transfer_photos').insert({
    conf_number: conf,
    photo_data: photoData,
    sort_order: (uiState.transferPhotos[conf]||[]).length,
  }).select().single();
  if (error) { setSyncStatus('error', 'Photo save failed'); console.error(error); return null; }
  setSyncStatus('ok', 'Saved');
  return data.id;
}

async function deleteTransferPhotoDB(dbId) {
  if (!db || !dbId) return;
  setSyncStatus('syncing', 'Deleting...');
  const { error } = await db.from('trust_transfer_photos').delete().eq('id', dbId);
  if (error) { setSyncStatus('error', 'Delete failed'); return; }
  setSyncStatus('ok', 'Saved');
}

async function deleteAllTransferPhotosByConf(conf) {
  if (!db) return;
  setSyncStatus('syncing', 'Deleting...');
  await db.from('trust_transfer_photos').delete().eq('conf_number', conf);
  setSyncStatus('ok', 'Saved');
}

function dbRowToEntry(row) {
  return {
    id: row.id,
    trade: row.trade_number || '',
    date: row.entry_date || '',
    address: row.address || '',
    buyer: row.buyer || '',
    particulars: row.particulars || '',
    deposit: parseFloat(row.deposit) || 0,
    disburse: parseFloat(row.disburse) || 0,
    void: row.is_void || false,
    balance: parseFloat(row.balance) || 0,
    sort_order: row.sort_order || row.id,
  };
}

async function saveEntry(entry, isNew = false) {
  setSyncStatus('syncing', 'Saving...');
  const row = {
    id: entry.id,
    trade_number: entry.trade || null,
    entry_date: entry.date || null,
    address: entry.address || null,
    buyer: entry.buyer || null,
    particulars: entry.particulars || null,
    deposit: entry.deposit || 0,
    disburse: entry.disburse || 0,
    is_void: entry.void || false,
    balance: entry.balance || 0,
    sort_order: entry.id,
  };
  let error;
  if (isNew) {
    ({ error } = await db.from('trust_entries').insert(row));
  } else {
    ({ error } = await db.from('trust_entries').update(row).eq('id', entry.id));
  }
  if (error) { setSyncStatus('error', 'Save failed'); throw error; }
  setSyncStatus('ok', 'Saved');
}

async function deleteEntryDB(id) {
  setSyncStatus('syncing', 'Deleting...');
  const { error } = await db.from('trust_entries').delete().eq('id', id);
  if (error) { setSyncStatus('error', 'Delete failed'); throw error; }
  setSyncStatus('ok', 'Saved');
}

async function saveOpeningBalance(val) {
  if (!db) { state.openingBalance = val; saveLocalState(); return; }
  const { data } = await db.from('trust_settings').select('id').limit(1).single();
  if (data) {
    await db.from('trust_settings').update({ opening_balance: val }).eq('id', data.id);
  } else {
    await db.from('trust_settings').insert({ opening_balance: val });
  }
}

// ── Local storage fallback ────────────────────────────────────────────────────
const LS_KEY = 'c21_trust_v3';
function loadLocalState() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) { const s = JSON.parse(raw); state = { ...state, ...s }; rebuildBalances(); }
  } catch(e) {}
}
function saveLocalState() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e) {}
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function parseMoney(s) { if (!s && s!==0) return 0; return parseFloat(String(s).replace(/[$,\s]/g,'')) || 0; }
function fmt(n) { if (!n && n!==0) return ''; return '$'+Math.abs(n).toLocaleString('en-CA',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtSigned(n) { if (!n) return ''; return (n<0?'-':'')+fmt(n); }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function rebuildBalances() {
  let running = state.openingBalance || 0;
  state.entries.forEach(e => {
    if (e.void) { e.balance = running; return; }
    running += (e.deposit||0) - (e.disburse||0);
    e.balance = running;
  });
}

function dateToNum(s) {
  if (!s) return 0;
  const months = {jan:1,january:1,feb:2,february:2,mar:3,march:3,apr:4,april:4,may:5,jun:6,june:6,jul:7,july:7,aug:8,august:8,sep:9,sept:9,september:9,oct:10,october:10,nov:11,november:11,dec:12,december:12};
  const mo = w => months[w.toLowerCase()] || 0;
  let m;
  m = s.match(/^([A-Za-z]+)\s+(\d+),?\s+(\d{4})/);
  if (m) return parseInt(m[3])*10000 + mo(m[1])*100 + parseInt(m[2]);
  m = s.match(/^([A-Za-z]+)\s+(\d+)\/(\d+)/);
  if (m) { const yr = parseInt(m[3])<100 ? 2000+parseInt(m[3]) : parseInt(m[3]); return yr*10000 + mo(m[1])*100 + parseInt(m[2]); }
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return parseInt(m[1])*10000 + parseInt(m[2])*100 + parseInt(m[3]);
  return 0;
}
function dateCompare(a,b) { return dateToNum(a) - dateToNum(b); }

function getTradeBalance(trade) {
  return state.entries.filter(e=>e.trade===trade&&!e.void).reduce((a,e)=>a+(e.deposit||0)-(e.disburse||0),0);
}

function getActiveTrades(asOfDate) {
  const asOfNum = asOfDate ? dateToNum(asOfDate) : 0;
  const map = {};
  state.entries.forEach(e => {
    if (!e.trade || e.void) return;
    if (asOfNum > 0) {
      const entryNum = dateToNum(e.date);
      if (entryNum === 0 && e.date) return;
      if (entryNum > asOfNum) return;
    }
    if (!map[e.trade]) map[e.trade] = { trade:e.trade, address:'', buyer:'', firstDepDate:'', balance:0 };
    const t = map[e.trade];
    t.balance += (e.deposit||0) - (e.disburse||0);
    if (!t.address && e.address) t.address = e.address;
    if (!t.buyer && e.buyer) t.buyer = e.buyer;
    if (e.deposit > 0 && !t.firstDepDate) t.firstDepDate = e.date;
  });
  return Object.values(map).filter(t=>t.balance>0.005).sort((a,b)=>Number(a.trade)-Number(b.trade));
}

function allTrades() {
  return [...new Set(state.entries.filter(e=>e.trade).map(e=>e.trade))].sort((a,b)=>Number(a)-Number(b));
}

// ── Navigation ────────────────────────────────────────────────────────────────
const TABS = [
  {id:'ledger', icon:'≡', label:'Trust control ledger', sub:'All trust account transactions'},
  {id:'trades', icon:'◫', label:'Individual trust records', sub:'Per-trade transaction history'},
  {id:'liability', icon:'▤', label:'Trust liability listing', sub:'Month-end balances by trade'},
  {id:'reconciliation', icon:'⊟', label:'Bank reconciliation', sub:'Match bank balance to liability'},
  {id:'receipt', icon:'◻', label:'Deposit receipt', sub:'Generate printable receipts'},
  {id:'transfers', icon:'⇄', label:'Trust transfers', sub:'Trust to general account transfers'},
  {id:'import', icon:'↑', label:'Import / export', sub:'CSV import and backup'},
];

function renderNav() {
  document.getElementById('sidebar-nav').innerHTML = TABS.map(t =>
    `<div class="nav-item ${currentTab===t.id?'active':''}" onclick="switchTab('${t.id}')">
      <span class="nav-icon">${t.icon}</span>${t.label}
    </div>`
  ).join('');
}

function switchTab(id) {
  currentTab = id;
  if (id !== 'trades') uiState.selectedTrade = null;
  const tab = TABS.find(t=>t.id===id);
  document.getElementById('page-title').textContent = tab.label;
  document.getElementById('page-subtitle').textContent = tab.sub;
  renderNav();
  renderContent();
}

// ── Main render ───────────────────────────────────────────────────────────────
function renderContent() {
  const el = document.getElementById('content');
  const actions = document.getElementById('topbar-actions');
  actions.innerHTML = '';
  if (currentTab==='ledger') { el.innerHTML = renderLedger(); setupLedgerActions(actions); }
  else if (currentTab==='trades') { el.innerHTML = renderTrades(); }
  else if (currentTab==='liability') { el.innerHTML = renderLiability(); setupLiabilityActions(actions); }
  else if (currentTab==='reconciliation') { el.innerHTML = renderReconciliation(); setupReconActions(actions); }
  else if (currentTab==='receipt') { el.innerHTML = renderReceipt(); setupReceiptActions(actions); }
  else if (currentTab==='transfers') { el.innerHTML = renderTransfers(); setupTransferActions(actions); }
  else if (currentTab==='import') { el.innerHTML = renderImport(); }
}

async function saveNewEntry() {
  const entry = {
    id: state.nextId++,
    trade: (document.getElementById('m_trade').value||'').trim(),
    date:  (document.getElementById('m_date').value||'').trim(),
    address: (document.getElementById('m_addr').value||'').trim(),
    buyer: (document.getElementById('m_buyer').value||'').trim(),
    particulars: (document.getElementById('m_part').value||'').trim(),
    deposit: parseMoney(document.getElementById('m_dep').value),
    disburse: parseMoney(document.getElementById('m_dis').value),
    void: document.getElementById('m_void').checked,
    balance: 0,
  };
  state.entries.push(entry);
  rebuildBalances();
  closeModal();
  renderContent();
  if (db) await saveEntry(entry, true);
  else saveLocalState();
}

async function saveEditEntry(id) {
  const e = state.entries.find(x=>x.id===id);
  if (!e) return;
  e.trade = (document.getElementById('m_trade').value||'').trim();
  e.date  = (document.getElementById('m_date').value||'').trim();
  e.address = (document.getElementById('m_addr').value||'').trim();
  e.buyer = (document.getElementById('m_buyer').value||'').trim();
  e.particulars = (document.getElementById('m_part').value||'').trim();
  e.deposit  = parseMoney(document.getElementById('m_dep').value);
  e.disburse = parseMoney(document.getElementById('m_dis').value);
  e.void = document.getElementById('m_void').checked;
  rebuildBalances();
  closeModal();
  renderContent();
  if (db) await saveEntry(e, false);
  else saveLocalState();
}

async function confirmDeleteEntry(id) {
  if (confirm('Delete this entry? This cannot be undone.')) {
    state.entries = state.entries.filter(x=>x.id!==id);
    rebuildBalances();
    closeModal();
    renderContent();
    if (db) await deleteEntryDB(id);
    else saveLocalState();
  }
}

async function doAssignTrade(id) {
  const t = (document.getElementById('m_trade').value||'').trim();
  if (!t) return;
  const e = state.entries.find(x=>x.id===id);
  e.trade = t;
  closeModal();
  renderContent();
  if (db) await saveEntry(e, false);
  else saveLocalState();
}

// ── TRADES ────────────────────────────────────────────────────────────────────
function renderTrades() {
  if (uiState.selectedTrade) return renderTradeDetail(uiState.selectedTrade);
  const trades = allTrades();
  const filter = uiState.tradeFilter.toLowerCase();
  const filtered = filter ? trades.filter(t => {
    const e = state.entries.find(x=>x.trade===t);
    return t.includes(filter)||(e?.address||'').toLowerCase().includes(filter)||(e?.buyer||'').toLowerCase().includes(filter);
  }) : trades;
  return `
  <div class="filter-bar">
    <input placeholder="Search by trade #, address or buyer..." value="${esc(uiState.tradeFilter)}"
      oninput="uiState.tradeFilter=this.value;document.getElementById('content').innerHTML=renderTrades()">
  </div>
  <div class="card" style="padding:0"><div class="table-wrap">
  <table>
    <thead><tr><th style="width:80px">Trade #</th><th>Address</th><th>Buyer</th><th style="width:120px;text-align:right">Balance</th><th style="width:60px"></th></tr></thead>
    <tbody>
    ${filtered.length===0?'<tr><td colspan="5" class="no-entries-hint">No trades found.</td></tr>':''}
    ${filtered.map(t => {
      const entries = state.entries.filter(e=>e.trade===t);
      const addr = entries.find(e=>e.address)?.address || '';
      const buyer = entries.find(e=>e.buyer)?.buyer || '';
      const bal = getTradeBalance(t);
      return `<tr>
        <td style="font-family:'DM Mono',monospace;font-size:12px;font-weight:500">${esc(t)}</td>
        <td style="font-size:12px">${esc(addr)}</td>
        <td style="font-size:12px">${esc(buyer)}</td>
        <td style="text-align:right"><span class="badge ${bal>0.005?'badge-green':'badge-gray'}">${bal>0.005?fmt(bal)+' open':'closed'}</span></td>
        <td style="text-align:right"><button class="btn-ghost btn-sm" onclick="uiState.selectedTrade='${esc(t)}';renderContent()">View →</button></td>
      </tr>`;
    }).join('')}
    </tbody>
  </table></div></div>`;
}

function refreshLiabilityTable() {
  const date = uiState.liabilityDate;
  const trades = getActiveTrades(date||null);
  const total = trades.reduce((a,t)=>a+t.balance,0);
  const sub = document.getElementById('liability-subtitle');
  const tbody = document.getElementById('liability-tbody');
  const totalCell = document.getElementById('liability-total');
  if (sub) sub.textContent = 'Trust Liability Listing'+(date?' · As of '+date:'');
  if (totalCell) totalCell.textContent = fmt(total);
  if (tbody) {
    tbody.innerHTML = trades.map(t=>`<tr>
      <td style="font-family:'DM Mono',monospace;font-size:12px;font-weight:500">${esc(t.trade)}</td>
      <td style="font-size:12px">${esc(t.address)}${t.buyer?' · '+esc(t.buyer):''}</td>
      <td style="font-size:12px;color:var(--text-muted)">${esc(t.firstDepDate)}</td>
      <td style="text-align:right;font-family:'DM Mono',monospace;font-size:12px;font-weight:500">${fmt(t.balance)}</td>
    </tr>`).join('')+(trades.length===0?'<tr><td colspan="4" class="no-entries-hint">No active trades for this date.</td></tr>':'');
  }
}

// ── RECONCILIATION ────────────────────────────────────────────────────────────
function refreshReconSummary() {
  const date = uiState.reconDate;
  const trades = getActiveTrades(date||null);
  const liabilityTotal = trades.reduce((a,t)=>a+t.balance,0);
  const bankBal = parseMoney(uiState.bankBalance);
  const adjs = uiState.adjustments || [];
  const adjTotal = adjs.reduce((a,adj)=>a+parseMoney(adj.amount),0);
  const reconBal = bankBal + adjTotal;
  const diff = reconBal - liabilityTotal;
  const balanced = Math.abs(diff) < 0.01;
  const s = document.getElementById('recon-summary');
  if (!s) return;
  s.innerHTML = `
    <tr><td style="padding:6px 0;color:var(--text-muted)">Bank statement ending balance</td>
        <td style="text-align:right;font-family:'DM Mono',monospace;font-size:13px;padding:6px 0">${fmt(bankBal)}</td></tr>
    ${adjs.filter(a=>parseMoney(a.amount)!==0).map(a=>`
    <tr><td style="padding:6px 0;color:var(--text-muted)">${esc(a.desc||'Adjustment')}</td>
        <td style="text-align:right;font-family:'DM Mono',monospace;font-size:13px;padding:6px 0">${fmtSigned(parseMoney(a.amount))}</td></tr>`).join('')}
    <tr style="border-top:1px solid var(--border-strong)">
      <td style="padding:10px 0;font-weight:600">Reconciled bank balance</td>
      <td style="text-align:right;font-family:'DM Mono',monospace;font-size:13px;font-weight:600;padding:10px 0">${fmt(reconBal)}</td>
    </tr>
    <tr><td style="padding:6px 0;color:var(--text-muted)">Trust liability listing total</td>
        <td style="text-align:right;font-family:'DM Mono',monospace;font-size:13px;padding:6px 0">${fmt(liabilityTotal)}</td></tr>
    <tr><td colspan="2" style="padding:10px 0">
      ${uiState.bankBalance
        ? `<span class="badge ${balanced?'badge-green':'badge-amber'}" style="font-size:13px;padding:5px 14px">
            ${balanced?'✓ Balanced':'Difference: '+fmtSigned(diff)}</span>`
        : '<span style="color:var(--text-faint);font-size:12px">Enter bank balance to check.</span>'}
    </td></tr>`;
}

function renderReconciliation() {
  const date = uiState.reconDate;
  const trades = getActiveTrades(date||null);
  const liabilityTotal = trades.reduce((a,t)=>a+t.balance,0);
  const bankBal = parseMoney(uiState.bankBalance);
  const adjs = uiState.adjustments || [];
  const adjTotal = adjs.reduce((a,adj)=>a+parseMoney(adj.amount),0);
  const reconBal = bankBal + adjTotal;
  const diff = reconBal - liabilityTotal;
  const balanced = Math.abs(diff) < 0.01;
  return `
  <div class="card">
    <div style="font-size:16px;font-weight:600;margin-bottom:2px">Century 21 Optimum Realty</div>
    <div style="font-size:13px;color:var(--text-muted);margin-bottom:20px">Monthly Trust Account Bank Reconciliation</div>
    <div class="form-row" style="margin-bottom:20px">
      <div class="form-group"><label>Statement date</label>
        <input type="text" id="recon-date-input" placeholder="e.g. February 28, 2026" value="${esc(date)}"
          oninput="uiState.reconDate=this.value;refreshReconSummary()"></div>
      <div class="form-group"><label>Bank statement ending balance</label>
        <input type="text" id="recon-bal-input" placeholder="$0.00" value="${esc(uiState.bankBalance)}"
          oninput="uiState.bankBalance=this.value;refreshReconSummary()"></div>
    </div>
    <hr class="divider">
    <div class="flex-between" style="margin-bottom:12px">
      <div class="section-header" style="margin:0">Manual adjustments</div>
      <button class="btn-sm" onclick="addAdjustment()">+ Add</button>
    </div>
    ${adjs.map((adj,i)=>`
    <div class="form-row" style="margin-bottom:8px;align-items:end">
      <div class="form-group" style="margin:0;flex:2"><label>Description</label>
        <input type="text" placeholder="e.g. Error correction" value="${esc(adj.desc||'')}"
          oninput="uiState.adjustments[${i}].desc=this.value"></div>
      <div class="form-group" style="margin:0;flex:1"><label>Amount (+/-)</label>
        <input type="text" placeholder="+6000 or -500" value="${esc(adj.amount||'')}"
          oninput="uiState.adjustments[${i}].amount=this.value;refreshReconSummary()"></div>
      <button class="btn-danger btn-sm" style="flex-shrink:0" onclick="removeAdjustment(${i})">Remove</button>
    </div>`).join('')}
    ${adjs.length===0?'<div style="color:var(--text-faint);font-size:12px;margin-bottom:12px">No adjustments.</div>':''}
    <hr class="divider">
    <table style="max-width:380px">
      <tbody id="recon-summary">
        <tr><td style="padding:6px 0;color:var(--text-muted)">Bank statement ending balance</td>
            <td style="text-align:right;font-family:'DM Mono',monospace;font-size:13px;padding:6px 0">${fmt(bankBal)}</td></tr>
        ${adjs.filter(a=>parseMoney(a.amount)!==0).map(a=>`
        <tr><td style="padding:6px 0;color:var(--text-muted)">${esc(a.desc||'Adjustment')}</td>
            <td style="text-align:right;font-family:'DM Mono',monospace;font-size:13px;padding:6px 0">${fmtSigned(parseMoney(a.amount))}</td></tr>`).join('')}
        <tr style="border-top:1px solid var(--border-strong)">
          <td style="padding:10px 0;font-weight:600">Reconciled bank balance</td>
          <td style="text-align:right;font-family:'DM Mono',monospace;font-size:13px;font-weight:600;padding:10px 0">${fmt(reconBal)}</td>
        </tr>
        <tr><td style="padding:6px 0;color:var(--text-muted)">Trust liability listing total</td>
            <td style="text-align:right;font-family:'DM Mono',monospace;font-size:13px;padding:6px 0">${fmt(liabilityTotal)}</td></tr>
        <tr><td colspan="2" style="padding:10px 0">
          ${uiState.bankBalance
            ? `<span class="badge ${balanced?'badge-green':'badge-amber'}" style="font-size:13px;padding:5px 14px">${balanced?'✓ Balanced':'Difference: '+fmtSigned(diff)}</span>`
            : '<span style="color:var(--text-faint);font-size:12px">Enter bank balance to check.</span>'}
        </td></tr>
      </tbody>
    </table>
  </div>`;
}

function setupReconActions(actions) {

function addAdjustment() { uiState.adjustments.push({desc:'',amount:''}); renderContent(); }
function removeAdjustment(i) { uiState.adjustments.splice(i,1); renderContent(); }

// ── RECEIPT ───────────────────────────────────────────────────────────────────
function getReceiptFields() {
  const f = Object.assign({from:'',address:'',amount:'',date:'',paytype:'EMT'}, uiState.receiptFields||{});
  const ids = {from:'rf_from',address:'rf_addr',amount:'rf_amt',date:'rf_date'};
  Object.entries(ids).forEach(([key,id]) => { const el=document.getElementById(id); if(el) f[key]=el.value; });
  const pt = document.getElementById('rf_paytype'); if (pt) f.paytype = pt.value;
  return f;
}

function setRF(field, val) {
  if (!uiState.receiptFields) uiState.receiptFields = {from:'',address:'',amount:'',date:'',paytype:'EMT'};
  uiState.receiptFields[field] = val;
  uiState.receiptManual = true;
  updateReceiptPreview();
}

function updateReceiptPreview() {
  const f = getReceiptFields();
  const p = document.getElementById('receipt-preview');
  if (!p) return;
  const title = p.querySelector('.receipt-title');
  if (title) title.textContent = 'Trust Deposit Receipt: '+(f.date||'[date]');
  const vals = p.querySelectorAll('.rf-value');
  const labels = p.querySelectorAll('.rf-label');
  const fieldMap = {'RECEIVED FROM':f.from||'—','TRUST DEPOSIT ON':f.address||'—','FUNDS RECEIVED':(f.amount||'—')+' CAD','DATE RECEIVED':f.date||'—','PAYMENT TYPE':f.paytype||'EMT','RECEIVED BY':'Rob Lough, Broker'};
  labels.forEach((lbl,i) => { if (vals[i]&&fieldMap[lbl.textContent]) vals[i].textContent = fieldMap[lbl.textContent]; });
}

  const sel = uiState.receiptTrade;

  if (sel && !uiState.receiptManual) {
    const entry = state.entries.find(e=>String(e.id)===String(sel));

function setupReceiptActions(actions) {
  const btn = document.createElement('button');
  btn.className = 'btn-gold'; btn.textContent = 'Download PDF';
  btn.onclick = downloadReceiptPDF;
  actions.appendChild(btn);
}

function handlePhotoUpload(input) {
  const file = input.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    if (!uiState.receiptPhotos) uiState.receiptPhotos = [];
    uiState.receiptPhotos.push(ev.target.result);
    input.value = ''; // reset so same file can be added again if needed
    renderContent();
  };
  reader.readAsDataURL(file);
}

function handlePhotoDrop(event) {
  event.preventDefault();
  const file = event.dataTransfer.files[0];
  if (!file||!file.type.startsWith('image/')) return;
  const reader = new FileReader();
  reader.onload = ev => {
    if (!uiState.receiptPhotos) uiState.receiptPhotos = [];
    uiState.receiptPhotos.push(ev.target.result);
    renderContent();
  };
  reader.readAsDataURL(file);
}

function removeReceiptPhoto(index) {
  uiState.receiptPhotos.splice(index, 1);
  renderContent();
}

// ── TRUST TRANSFERS ───────────────────────────────────────────────────────────

// Parse confirmation number from particulars like "Trans to Gen HQ304"
function extractConfNum(particulars) {
  if (!particulars) return null;
  const m = (particulars||'').match(/Trans\s+to\s+Gen\s+([A-Z0-9]+)/i);
  return m ? m[1].toUpperCase() : null;
}

// Get all transfer entries grouped by confirmation number
function getTransferGroups() {
  const groups = {};
  state.entries.forEach(e => {
    if (!e.disburse || e.void) return;
    const conf = extractConfNum(e.particulars);
    if (!conf) return;
    if (!groups[conf]) groups[conf] = { conf, date: e.date, entries: [], total: 0 };
    groups[conf].entries.push(e);
    groups[conf].total += e.disburse;
    if (!groups[conf].date && e.date) groups[conf].date = e.date;
  });
  return Object.values(groups).sort((a,b) => dateToNum(b.date) - dateToNum(a.date));
}

function renderTransfers() {
  if (uiState.selectedTransferConf) return renderTransferDetail(uiState.selectedTransferConf);
  const groups = getTransferGroups();
  const totalTransferred = groups.reduce((a,g)=>a+g.total, 0);

  return `
  <div class="summary-grid" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr))">
    <div class="stat-card"><div class="stat-label">Total transfers</div><div class="stat-value">${groups.length}</div></div>
    <div class="stat-card"><div class="stat-label">Total transferred</div><div class="stat-value" style="font-size:15px">${fmt(totalTransferred)}</div></div>
  </div>
  <div class="card" style="padding:0">
    <div class="table-wrap">
    <table>
      <thead><tr>
        <th style="width:110px">Confirmation #</th>
        <th style="width:100px">Date</th>
        <th>Trades included</th>
        <th style="width:80px;text-align:center">Photos</th>
        <th style="width:110px;text-align:right">Total amount</th>
        <th style="width:80px"></th>
      </tr></thead>
      <tbody>
      ${groups.length===0?'<tr><td colspan="6" class="no-entries-hint">No transfer entries found. Transfer entries should include "Trans to Gen XXXXXX" in the particulars field.</td></tr>':''}
      ${groups.map(g => {
        const photoCount = (uiState.transferPhotos[g.conf]||[]).length;
        const tradeList = g.entries.map(e=>e.trade?`#${e.trade}`:e.address||'—').join(', ');
        return `<tr>
          <td style="font-family:'DM Mono',monospace;font-size:12px;font-weight:500">${esc(g.conf)}</td>
          <td style="font-size:12px;color:var(--text-muted)">${esc(g.date)}</td>
          <td style="font-size:12px">${esc(tradeList)}</td>
          <td style="text-align:center">
            ${photoCount > 0
              ? `<span class="badge badge-green">${photoCount} photo${photoCount>1?'s':''}</span>`
              : `<span class="badge badge-gray">None</span>`}
          </td>
          <td style="text-align:right;font-family:'DM Mono',monospace;font-size:12px;font-weight:500">${fmt(g.total)}</td>
          <td style="text-align:right">
            <button class="btn-ghost btn-sm" onclick="uiState.selectedTransferConf='${esc(g.conf)}';renderContent()">View →</button>
          </td>
        </tr>`;
      }).join('')}
      </tbody>
    </table>
    </div>
  </div>`;
}

function renderTransferDetail(conf) {
  const groups = getTransferGroups();
  const group = groups.find(g=>g.conf===conf);
  if (!group) return `<div class="trade-back-btn" onclick="uiState.selectedTransferConf=null;renderContent()">← All transfers</div><div class="alert alert-error">Transfer not found.</div>`;

  const photos = uiState.transferPhotos[conf] || [];
  const act = document.getElementById('topbar-actions');
  if (act) {
    act.innerHTML = '';
    const b = document.createElement('button');
    b.className = 'btn-gold'; b.textContent = 'Download PDF';
    b.onclick = () => downloadTransferPDF(conf);
    act.appendChild(b);
  }

  return `
  <div class="flex-between" style="margin-bottom:16px">
    <div class="trade-back-btn" style="margin:0" onclick="uiState.selectedTransferConf=null;renderContent()">← All transfers</div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start">

async function handleTransferPhoto(input, conf) {
  const file = input.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = async ev => {
    const photoData = ev.target.result;
    if (!uiState.transferPhotos[conf]) uiState.transferPhotos[conf] = [];
    // Save to DB first to get the ID
    const dbId = await saveTransferPhotoDB(conf, photoData);
    uiState.transferPhotos[conf].push({ data: photoData, dbId });
    input.value = '';
    renderContent();
  };
  reader.readAsDataURL(file);
}

async function removeTransferPhoto(conf, index) {
  const photo = (uiState.transferPhotos[conf]||[])[index];
  if (photo && photo.dbId) await deleteTransferPhotoDB(photo.dbId);

  renderContent();
}

async function removeAllTransferPhotos(conf) {

async function downloadTransferPDF(conf) {
  const groups = getTransferGroups();
  const group = groups.find(g=>g.conf===conf);
  if (!group) return;
  const photos = uiState.transferPhotos[conf] || [];

  const doc = await makePDF();
  let y = pdfHeader(doc, 'Trust to General Transfer', 'Confirmation # ' + conf + ' · ' + group.date);

  // Photos first — one per bank transfer screenshot
  if (photos.length > 0) {
    for (let i = 0; i < photos.length; i++) {
      const imgData = photos[i].data || photos[i];
      try {
        const ext = imgData.substring(imgData.indexOf('/')+1, imgData.indexOf(';'));
        const format = (ext==='jpg'||ext==='jpeg') ? 'JPEG' : 'PNG';
        const img = new Image();
        await new Promise(res=>{img.onload=res; img.src=imgData;});
        const maxW = 156, maxH = 100;
        const ratio = Math.min(maxW/img.naturalWidth, maxH/img.naturalHeight);
        const w = img.naturalWidth*ratio, h = img.naturalHeight*ratio;
        if (y + h > 255) { doc.addPage(); y = 20; }
        doc.addImage(imgData, format, 20, y, w, h);
        y += h + 8;
      } catch(e) { console.error('Photo embed error', e); }
    }
  }

  // Trade table
  if (y + 30 > 255) { doc.addPage(); y = 20; }
  doc.setDrawColor(184,169,122); doc.setLineWidth(0.5); doc.line(20, y, 196, y);
  y += 6;

  const body = group.entries.map(e => [
    e.trade||'—', e.address||'', e.date||'', fmt(e.disburse)
  ]);
  body.push([
    '', '',
    {content:'Total', styles:{fontStyle:'bold'}},
    {content:fmt(group.total), styles:{fontStyle:'bold'}}
  ]);

  doc.autoTable({
    startY: y,
    head: [['Trade #', 'Address', 'Date', 'Amount']],
    body,
    theme: 'plain',
    styles: { fontSize: 10, cellPadding: 3, textColor: [30,30,30] },
    headStyles: { fontSize: 9, textColor: [100,100,100], fontStyle: 'normal', lineWidth: { bottom: 0.3 }, lineColor: [184,169,122] },
    columnStyles: { 0: { cellWidth: 22 }, 2: { cellWidth: 30 }, 3: { halign: 'right', cellWidth: 30 } },
    margin: { left: 20, right: 20 },
  });

  pdfFooter(doc);
  doc.save('Trust_Transfer_' + conf + '_' + (group.date||'').replace(/[\s,\/]/g,'_') + '.pdf');
}

async function doImport() {
  const ob = parseMoney(document.getElementById('ob_input').value);
  if (ob || ob === 0) {
    state.openingBalance = ob;
    await saveOpeningBalance(ob);
  }
  const file = document.getElementById('csv_file').files[0];
  if (!file) { renderContent(); return; }
  const reader = new FileReader();
  reader.onload = async ev => {
    const entries = parseCSV(ev.target.result);
    // Delete all existing and re-insert if using DB
    if (db) {
      setSyncStatus('syncing', 'Importing...');
      await db.from('trust_entries').delete().neq('id', -1);
      for (const e of entries) await saveEntry(e, true);
      await loadFromDB();
      setSyncStatus('ok', 'Imported');
    } else {
      state.entries = entries;
      state.nextId = entries.reduce((m,e)=>Math.max(m,e.id),0)+1;
      rebuildBalances();
      saveLocalState();
    }
    const msg = document.getElementById('import_msg');
    if (msg) { msg.textContent = '✓ Imported '+entries.length+' entries.'; msg.style.color='var(--green)'; }
    setTimeout(()=>switchTab('ledger'),800);
  };
  reader.readAsText(file);
}

function parseCSV(text) {
  const lines = text.split('\n').filter(l=>l.trim());
  const entries = []; let id=1; let foundHeader=false; let prev=null;
  for (let i=0; i<lines.length; i++) {
    const cols = splitCSVLine(lines[i]);
    if (cols.length < 5) continue;
    const [c0,c1,c2,c3,c4,c5,c6] = cols.map(c=>(c||'').trim().replace(/^NaN$|^nan$/,''));
    if (!foundHeader) { if (c0==='Trade'||c1==='Date'||c4.includes('Patriculars')) { foundHeader=true; continue; } continue; }
    if (c4==='Balance Forward'||c4.includes('Patriculars')) continue;
    const dep=parseMoney(c5), dis=parseMoney(c6);
    const isVoid = c4.toUpperCase().includes('VOID');
    if (!c0&&!dep&&!dis&&prev&&!isVoid) { if(c4) prev.particulars+=' '+c4; if(c2&&!prev.address) prev.address=c2; continue; }
    const entry = {id:id++,trade:c0||'',date:c1||'',address:c2||'',buyer:c3||'',particulars:c4||'',deposit:dep,disburse:dis,void:isVoid,balance:0};
    entries.push(entry); prev=entry;
  }
  return entries;
}

function splitCSVLine(line) {
  const result=[]; let cur='',inQ=false;
  for (let i=0;i<line.length;i++) {
    const c=line[i];
    if(c==='"'){inQ=!inQ;}else if(c===','&&!inQ){result.push(cur);cur='';}else{cur+=c;}
  }
  result.push(cur); return result;
}

function exportCSV() {
  const header='Trade,Date,Address,Buyer,Particulars,Deposit,Disburse,Balance,Void\n';
  const rows=state.entries.map(e=>[
    e.trade,e.date,
    `"${(e.address||'').replace(/"/g,'""')}"`  ,
    `"${(e.buyer||'').replace(/"/g,'""')}"`    ,
    `"${(e.particulars||'').replace(/"/g,'""')}"`  ,
    e.deposit||'',e.disburse||'',e.balance||'',e.void?'VOID':''
  ].join(',')).join('\n');
  const blob=new Blob([header+rows],{type:'text/csv'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='C21_Trust_Backup_'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
}

async function getJsPDF() {
  return new Promise((res,rej) => {
    if (window.jspdf?.jsPDF) { res(window.jspdf.jsPDF); return; }
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    s.onload=()=>res(window.jspdf.jsPDF); s.onerror=rej;
    document.head.appendChild(s);
  });
}
async function getAutoTable() {
  return new Promise((res,rej) => {
    if (window.jspdfAutoTable) { res(); return; }
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js';
    s.onload=()=>{window.jspdfAutoTable=true;res();}; s.onerror=rej;
    document.head.appendChild(s);
  });
}
async function makePDF() {
  const JsPDF = await getJsPDF(); await getAutoTable();
  return new JsPDF({orientation:'portrait',unit:'mm',format:'letter'});
}

function pdfHeader(doc, title, subtitle) {
  // Logo
  try {
    doc.addImage('data:image/png;base64,'+LOGO_B64, 'PNG', 20, 12, 55, 19);
  } catch(e) {
    doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(37,37,38);
    doc.text('Century 21 Optimum Realty', 20, 22);
  }
  doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(100,100,100);
  doc.text(title, 20, 36);
  if (subtitle) doc.text(subtitle, 20, 42);
  doc.setDrawColor(184,169,122);
  doc.setLineWidth(0.5);
  doc.line(20, subtitle?46:40, 196, subtitle?46:40);
  return subtitle?52:44;
}

function pdfFooter(doc) {
  const n=doc.internal.getNumberOfPages();
  for (let i=1;i<=n;i++) {
    doc.setPage(i); doc.setFontSize(8); doc.setTextColor(160,160,160);
    doc.text(`Page ${i} of ${n}`, 196, 272, {align:'right'});
  }
}

  const body=entries.map(e=>{
    running+=(e.deposit||0)-(e.disburse||0);
    return [e.date||'',e.particulars||'',e.disburse?fmt(e.disburse):'',e.deposit?fmt(e.deposit):'',fmt(running)];
  });
  const finalBal=running;
  const doc=await makePDF();
  let y=pdfHeader(doc,'Individual Trust Record','Trade #'+trade);
  doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(80,80,80);
  doc.text('Address:',20,y+6); doc.setTextColor(20,20,20); doc.text(addr,45,y+6);
  doc.setTextColor(80,80,80); doc.text('Buyer:',20,y+13); doc.setTextColor(20,20,20); doc.text(buyer,45,y+13);
  doc.setTextColor(80,80,80); doc.text('Status:',20,y+20);
  doc.setTextColor(finalBal>0.005?26:80,finalBal>0.005?74:80,finalBal>0.005?42:80);
  doc.setFont('helvetica','bold');
  doc.text(finalBal>0.005?'Open — '+fmt(finalBal):'Closed',45,y+20);
  y+=30;
  doc.autoTable({startY:y,head:[['Date','Description','Debit','Credit','Balance']],
    body:body.length>0?body:[[''  ,'No entries','','','']],theme:'plain',
    styles:{fontSize:10,cellPadding:3,textColor:[30,30,30]},
    headStyles:{fontSize:9,textColor:[100,100,100],fontStyle:'normal',lineWidth:{bottom:.3},lineColor:[184,169,122]},
    columnStyles:{0:{cellWidth:28},2:{halign:'right',cellWidth:28,textColor:[139,32,32]},3:{halign:'right',cellWidth:28,textColor:[26,74,42]},4:{halign:'right',cellWidth:30,fontStyle:'bold'}},
    margin:{left:20,right:20}});
  pdfFooter(doc);
  doc.save('Individual_Trust_Record_Trade_'+trade+'.pdf');
}

async function downloadLedgerPDF() {
  // Read live date inputs if they exist
  const fromEl = document.getElementById('ledger-from-date');
  const toEl = document.getElementById('ledger-to-date');
  const fromDate = (fromEl ? fromEl.value : uiState.ledgerFromDate || '').trim();
  const toDate = (toEl ? toEl.value : uiState.ledgerToDate || '').trim();
  const fromNum = fromDate ? dateToNum(fromDate) : 0;
  const toNum = toDate ? dateToNum(toDate) : 99999999;

  // Filter entries by date range
  let filtered = state.entries;
  if (fromNum > 0 || toNum < 99999999) {
    filtered = state.entries.filter(e => {
      if (!e.date) return true;
      const n = dateToNum(e.date);
      if (n === 0) return true;
      return n >= fromNum && n <= toNum;
    });
  }

  // Calculate opening balance for the period
  let openingBal = state.openingBalance || 0;
  if (fromNum > 0) {
    const beforeEntries = state.entries.filter(e => {
      if (!e.date || e.void) return false;
      const n = dateToNum(e.date);
      return n > 0 && n < fromNum;
    });
    if (beforeEntries.length > 0) {
      openingBal = beforeEntries[beforeEntries.length-1].balance || openingBal;
    }
  }

  const JsPDF = await getJsPDF();
  await getAutoTable();
  const doc = new JsPDF({ orientation: 'landscape', unit: 'mm', format: 'letter' });

  const pageW = 279;
  const margin = 10; // tighter margins

  // Build table body
  let running = openingBal;
  const body = [];
  body.push([
    { content: 'Balance forward', colSpan: 5, styles: { fontStyle: 'italic', textColor: [150,150,150] } },
    { content: '', styles: { halign: 'right' } },
    { content: '', styles: { halign: 'right' } },
    { content: fmt(openingBal), styles: { halign: 'right', fontStyle: 'bold' } }
  ]);

  filtered.forEach(e => {
    if (!e.void) running += (e.deposit||0) - (e.disburse||0);
    body.push([
      e.trade || '',
      e.date || '',
      e.address || '',
      e.buyer || '',
      e.particulars || (e.void ? 'VOID' : ''),
      e.deposit ? fmt(e.deposit) : '',
      e.disburse ? fmt(e.disburse) : '',
      e.void ? '' : fmt(running),
    ]);
  });

  // Total usable width: 279 - 20 (margins) = 259mm
  // Col widths must sum to 259
  const colWidths = {
    0: 15,  // Trade #
    1: 20,  // Date
    2: 50,  // Address
    3: 42,  // Buyer name
    4: 62,  // Particulars — reduced to give more room to amounts
    5: 24,  // Deposit
    6: 24,  // Disburse
    7: 22,  // Balance — 15+20+50+42+62+24+24+22 = 259 ✓
  };

  doc.autoTable({
    startY: 32,
    head: [['Trade #', 'Date', 'Address', 'Buyer name', 'Particulars & transfer #', 'Deposit', 'Disburse', 'Balance']],
    body,
    theme: 'plain',
    styles: { fontSize: 8.5, cellPadding: 2.2, textColor: [30,30,30], overflow: 'ellipsize' },
    headStyles: {
      fontSize: 7.5, textColor: [100,100,100], fontStyle: 'normal',
      lineWidth: { bottom: 0.3 }, lineColor: [184,169,122],
      fillColor: [245,244,240]
    },
    columnStyles: {
      0: { cellWidth: colWidths[0] },
      1: { cellWidth: colWidths[1] },
      2: { cellWidth: colWidths[2] },
      3: { cellWidth: colWidths[3] },
      4: { cellWidth: colWidths[4] },
      5: { cellWidth: colWidths[5], halign: 'right', textColor: [26,74,42], overflow: 'visible' },
      6: { cellWidth: colWidths[6], halign: 'right', textColor: [139,32,32], overflow: 'visible' },
      7: { cellWidth: colWidths[7], halign: 'right', fontStyle: 'bold', overflow: 'visible' },
    },
    margin: { left: margin, right: margin, top: 32 },
    didDrawPage: (data) => {
      // Header on every page
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(12);
      doc.setTextColor(37, 37, 38);
      doc.text('Century 21 Optimum Realty', margin, 12);

      doc.setFont('helvetica', 'normal');
      doc.setFontSize(9);
      doc.setTextColor(100, 100, 100);
      doc.text('Century 21 Optimum Realty Trust Account Control Ledger', margin, 18);

      const rangeText = fromDate && toDate
        ? `Period: ${fromDate} to ${toDate}`
        : fromDate ? `From: ${fromDate}` : toDate ? `To: ${toDate}` : 'All entries';
      doc.text(rangeText, margin, 24);

      doc.setDrawColor(184, 169, 122);
      doc.setLineWidth(0.5);
      doc.line(margin, 27, pageW - margin, 27);
    },
  });

  // Add correct page numbers after all pages are rendered
  const totalPages = doc.internal.getNumberOfPages();
  for (let i = 1; i <= totalPages; i++) {
    doc.setPage(i);
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(9);
    doc.setTextColor(100, 100, 100);
    // White out any previous page number area and redraw
    doc.setFillColor(255, 255, 255);
    doc.rect(pageW - margin - 38, 8, 40, 8, 'F');
    doc.text(`Page ${i} of ${totalPages}`, pageW - margin, 14, { align: 'right' });
  }

  const datePart = fromDate && toDate
    ? `${fromDate}_to_${toDate}`.replace(/[\s,\/]/g,'_')
    : 'All_Entries';
  doc.save(`Trust_Control_Ledger_${datePart}.pdf`);
}

  root.innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`;
