<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;font-size:14px;background:#f5f4f0;color:#1a1916;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.login-wrap{width:100%;max-width:400px;padding:24px;}
.login-card{background:#fff;border:1px solid #e2e0d8;border-radius:12px;padding:36px 32px;box-shadow:0 4px 20px rgba(0,0,0,0.08);}
.logo-area{text-align:center;margin-bottom:28px;}
.logo-area img{max-width:180px;margin-bottom:14px;}
.logo-area h1{font-size:16px;font-weight:500;color:#252526;margin-bottom:4px;}
.logo-area p{font-size:12px;color:#6b6860;}
.form-group{margin-bottom:16px;}
.form-group label{display:block;font-size:12px;color:#6b6860;margin-bottom:5px;font-weight:500;letter-spacing:.01em;}
input{font-family:'DM Sans',sans-serif;font-size:14px;color:#1a1916;background:#fff;border:1px solid #c8c5ba;border-radius:8px;padding:10px 14px;width:100%;transition:border-color .12s;outline:none;}
input:focus{border-color:#B8A97A;box-shadow:0 0 0 3px rgba(184,169,122,0.15);}
.btn-login{width:100%;background:#252526;color:#fff;border:none;border-radius:8px;padding:12px 16px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;transition:background .12s;margin-top:4px;}
.btn-login:hover{background:#3a3a3b;}
.btn-login:disabled{background:#9c9a94;cursor:not-allowed;}
.error-msg{background:#fdf0f0;color:#8b2020;border:1px solid #e8c0c0;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:16px;display:none;}
.footer-note{text-align:center;margin-top:20px;font-size:11px;color:#9c9a94;}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,0.3);border-radius:50%;border-top-color:#fff;animation:spin .6s linear infinite;margin-right:6px;vertical-align:middle;}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>

      <label for="email">Email Address</label>

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">

</div>

<script>
const SUPABASE_URL = 'https://ygatvjjqrerswsrwmijd.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlnYXR2ampxcmVyc3dzcndtaWpkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExODk2NjgsImV4cCI6MjA5Njc2NTY2OH0.ct-JwnYKxWZFKJ6aq-l4H6A4hOuEkvosP5ZTvSSg1Hk';

let sbClient = null;

async function initLogin() {
  // Load Supabase
  await new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js';
    s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });

  sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // If already logged in, go straight to app
  const { data: { session } } = await sbClient.auth.getSession();
  if (session) {
    window.location.href = 'app.html';
    return;
  }

  // Allow Enter key to submit
  document.getElementById('password').addEventListener('keydown', e => {
    if (e.key === 'Enter') handleLogin();
  });
  document.getElementById('email').addEventListener('keydown', e => {
    if (e.key === 'Enter') handleLogin();
  });
}

async function handleLogin() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('login-btn');
  const errEl = document.getElementById('error-msg');

  errEl.style.display = 'none';

  if (!email || !password) {
    showError('Please enter your email and password.');
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Signing in…';

  try {
    const { data, error } = await sbClient.auth.signInWithPassword({ email, password });

    if (error) {
      showError('Invalid email or password. Please try again.');
      btn.disabled = false;
      btn.textContent = 'Sign In';
      return;
    }

    // Success — go to the app
    window.location.href = 'app.html';

  } catch (e) {
    showError('Something went wrong. Please try again.');
    btn.disabled = false;
    btn.textContent = 'Sign In';
  }
}

function showError(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = msg;
  el.style.display = 'block';
}

initLogin();
</script>
